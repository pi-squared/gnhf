name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # release-please opens its release PR with GITHUB_TOKEN, which creates a
    # pull_request run that can only sit in action_required. Its output set is
    # exactly these files, so excluding them means no run is ever created.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - package.json

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm test

  supervised-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Enable isolated candidate verification on the disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-net --ro-bind / / -- true
      - name: Exercise synthetic orchestration and repair
        run: python3 -m unittest discover -s contrib/supervisor -p 'test_*.py'
